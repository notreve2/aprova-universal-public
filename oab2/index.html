<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0f2747" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>2ª Fase OAB — Constitucional</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="styles.css?v=24" />
</head>
<body>
  <header class="topbar">
    <div>
      <div class="eyebrow">47º EXAME • 2ª FASE</div>
      <h1>Constitucional</h1>
    </div>
    <div class="countdown" id="countdown">—</div>
  </header>
  <nav class="tabs" aria-label="Navegação principal">
    <button data-tab="hoje" class="active">Hoje</button>
    <button data-tab="cronograma">Cronograma</button>
    <button data-tab="pecas">Peças</button>
    <button data-tab="fundamentos">Fundamentação</button>
    <button data-tab="constituicao">Constituição</button>
    <button data-tab="espelho">Espelho FGV</button>
    <button data-tab="vade">Vade Mecum</button>
    <button data-tab="questoes">Questões</button>
    <button data-tab="simulados">Simulados</button>
    <button data-tab="revisao">Revisão</button>
    <button data-tab="erros">Erros</button>
  </nav>
  <main>
    <section id="hoje" class="panel active"></section>
    <section id="cronograma" class="panel"></section>
    <section id="pecas" class="panel"></section>
    <section id="fundamentos" class="panel"></section>
    <section id="constituicao" class="panel"></section>
    <section id="espelho" class="panel"></section>
    <section id="vade" class="panel"></section>
    <section id="questoes" class="panel"></section>
    <section id="simulados" class="panel"></section>
    <section id="revisao" class="panel"></section>
    <section id="erros" class="panel"></section>
  </main>
  <footer>
    <span>Plataforma independente • estudo com fontes oficiais públicas OAB/FGV</span>
    <span id="progressText"></span>
  </footer>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="pieces_complete.js?v=24"></script>
  <script src="app.js?v=26"></script>
  <script src="flow_hotfix.js?v=1"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js?v=20', { updateViaCache: 'none' })
          .then(reg => reg.update())
          .catch(() => {});
      });
    }
  </script>
</body>
</html>
