name: Atualizar catálogo de concursos
on:
  schedule:
    - cron: "15 9 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4 pypdf
      - run: python scripts/update_catalog.py
      - run: python scripts/enrich_exam_dates_strict.py
      - name: Commit catalog changes
        run: |
          git config user.name "aprova-bot"
          git config user.email "aprova-bot@users.noreply.github.com"
          git add data/catalog.json
          git diff --cached --quiet || git commit -m "Atualiza catálogo automático"
          git push
